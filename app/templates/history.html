{% extends "base.html" %}{% block body %}
<h1>History</h1><table><tr><th>Time (UTC)</th><th>File</th><th>Decision</th><th>Confidence</th><th>Model</th><th>Version</th></tr>
{% for r in rows %}<tr><td>{{ r[0] }}</td><td>{{ r[1] }}</td><td>{{ r[2] }}</td><td>{{ (r[3]*100)|round(1) }}%</td><td>{{ r[4] }}</td><td>{{ r[5] }}</td></tr>
{% else %}<tr><td colspan="6">No predictions yet.</td></tr>{% endfor %}</table>{% endblock %}
