name: rollno_a2_ops
services:
  web:
    build: .
    ports: ["5000:5000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes: ["./models:/models:ro"]     # mounted: swap champion without rebuilding the image
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    # no "ports:" => database is not reachable from outside
volumes:
  pgdata:
